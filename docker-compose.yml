# docker compose up --build                     -> app + Qdrant, offline LLM template
# docker compose --profile llm up --build       -> adds Ollama (pull the model once, see README)
services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      LLM_MODE: auto
    depends_on: [qdrant]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  ollama:
    image: ollama/ollama:latest
    profiles: [llm]
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
volumes:
  qdrant_data:
  ollama_data:
